[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "revisor-crf"
version = "0.2.0"
description = "Lector local de documentos DOCX con trazabilidad estructural"
requires-python = ">=3.11"
dependencies = ["python-docx==1.2.0", "lxml==6.0.2"]

[project.scripts]
revisor-crf = "revisor_crf.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
addopts = "--basetemp=.pytest_tmp"
