[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "revisor-crf"
version = "0.5.0"
description = "Lector y motor híbrido local de validaciones para documentos CRF"
requires-python = ">=3.11"
dependencies = ["python-docx==1.2.0", "lxml==6.0.2"]

[project.scripts]
revisor-crf = "revisor_crf.cli:main"
revisor-crf-semantic-service = "revisor_crf.semantic_service:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
revisor_crf = ["editorial_catalog.json", "editorial_models.json", "editorial_abbreviations.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
addopts = "--basetemp=.pytest_runtime"
